name: Validate Vegz User

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Test customer marketplace integration
        run: python -m unittest discover -s backend/tests -v
      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js
      - name: Build Next.js customer web
        run: |
          npm --prefix web install --no-audit --no-fund
          npm --prefix web run build
      - name: Type-check Expo customer app
        run: |
          npm --prefix mobile install --no-audit --no-fund
          npm --prefix mobile run typecheck
